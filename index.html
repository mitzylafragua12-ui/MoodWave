<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="description" content="MoodWave — Plataforma de bienestar emocional con detección facial, actividades de autocuidado y gamificación." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700;800&family=Saira+Semi+Condensed:wght@500;700;800&display=swap" rel="stylesheet" />
    <script>
      // Aplica el tema guardado antes de pintar (evita un destello del tema equivocado).
      try {
        var t = localStorage.getItem('mw-theme') || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('mw-lang'); if (l) document.documentElement.lang = l;
      } catch (e) {}
    </script>
    <title>MoodWave</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
