# MoodWave — servidor estático (SPA) dentro del contenedor.
#  - HTTP  (puerto 80 del contenedor → 8080): para usar en la misma computadora (localhost).
#  - HTTPS (puerto 443 → 8443): para otros dispositivos de la red; la cámara exige HTTPS fuera de localhost.
# El certificado lo genera docker/30-moodwave-certs.sh al arrancar.

server {
    listen 80;
    server_name _;
    include /etc/nginx/moodwave/app.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/moodwave/certs/server.crt;
    ssl_certificate_key /etc/moodwave/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    include /etc/nginx/moodwave/app.inc;
}
