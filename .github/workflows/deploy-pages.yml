name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Credenciales de Supabase
        # Por defecto se usan las de .env.production. Si se definen las variables del repositorio
        # (Settings → Secrets and variables → Actions → Variables), tienen prioridad.
        run: |
          if [ -n "${{ vars.VITE_SUPABASE_URL }}" ] && [ -n "${{ vars.VITE_SUPABASE_ANON_KEY }}" ]; then
            printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "${{ vars.VITE_SUPABASE_URL }}" "${{ vars.VITE_SUPABASE_ANON_KEY }}" > .env.production.local
          fi
          if ! grep -qs '^VITE_SUPABASE_URL=.\+' .env.production.local .env.production || ! grep -qs '^VITE_SUPABASE_ANON_KEY=.\+' .env.production.local .env.production; then
            echo "::error::Faltan VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY (.env.production o variables del repositorio)"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Compilar
        run: npm run build
        env:
          # La app se sirve en https://<usuario>.github.io/<repositorio>/
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Rutas de la SPA (GitHub Pages no tiene reescrituras)
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
