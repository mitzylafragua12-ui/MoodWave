# MoodWave en local con Docker. La base de datos sigue en Supabase (nube).
#   docker compose up -d --build     → http://localhost:8080
services:
  web:
    build: .
    image: moodwave:latest
    container_name: moodwave
    ports:
      - "${MOODWAVE_PORT:-8080}:80"
    environment:
      # Opcional: apuntar a otro proyecto de Supabase sin recompilar.
      # Si se dejan vacías, se usa el proyecto con el que se compiló la imagen (.env.production).
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    restart: unless-stopped
